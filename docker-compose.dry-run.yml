services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HL_COINS: BTC
      HL_TESTNET: "true"
      DRY_RUN: "true"
      MODEL: mock
      TICK_MS: "30000"
      PRICE_MS: "200"
      QUOTE_USD: "40"
      PORT: "3000"
      BANKROLL_USD: "200"
      DAILY_AI_BUDGET_USD: "0.60"
      PAPER_DATA_DIR: /app/data/paper
      PAPER_MAX_POSITION_USD: "100"
      PAPER_MAX_LOSS_USD: "20"
    volumes:
      - paper-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: /api
      BOT_API_INTERNAL_URL: http://bot:3000
      PORT: "3001"
    depends_on:
      bot:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  paper-data:
